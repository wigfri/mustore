server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Same-origin API for the SPA (see VITE_API_BASE_URL in Dockerfile).
    # Resolver + variable host: resolve `backend` at request time (Docker DNS 127.0.0.11).
    # Append $request_uri: a lone variable proxy_pass can forward only the location
    # prefix (e.g. POST /api/) instead of /api/v1/...
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_host backend;
        proxy_pass http://$api_host:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
